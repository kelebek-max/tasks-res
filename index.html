<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jira Clone - Board</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-actions">
            <button class="btn btn-header-secondary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">

                    <circle cx="19" cy="12" r="1"></circle>
                    <circle cx="5" cy="12" r="1"></circle>

                More
            </button>

            <button class="btn btn-header-primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>

        </div>

        <div class="search-bar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b778c" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>

            <input type="text" placeholder="Search issues...">

    <!-- Main Content -->

                    </svg>

            </div>

            <ul class="sidebar-menu">

                <li class="sidebar-menu-item active" onclick="navigateTo('dashboard')">

                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                    </span>
                    Dashboard
                </li>

                <li class="sidebar-menu-item" onclick="navigateTo('boards')">
                    <span class="sidebar-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="18"></rect>
                            <rect x="14" y="3" width="7" height="6"></rect>
                            <rect x="14" y="11" width="7" height="10"></rect>
                        </svg>
                    </span>
                    Boards
                </li>

                <li class="sidebar-menu-item" onclick="navigateTo('issues')">
                    <span class="sidebar-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                        </svg>
                    </span>
                    Issues
                </li>

                <li class="sidebar-menu-item" onclick="navigateTo('calendar')">
                    <span class="sidebar-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                    </span>
                    Calendar
                </li>

                <li class="sidebar-menu-item" onclick="navigateTo('reports')">
                    <span class="sidebar-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="20" x2="18" y2="10"></line>
                            <line x1="12" y1="20" x2="12" y2="4"></line>
                            <line x1="6" y1="20" x2="6" y2="14"></line>
                        </svg>
                    </span>
                    Reports
                </li>

                <li class="sidebar-section-title">Проекты</li>

                <li class="sidebar-menu-item" onclick="navigateTo('projects')">
                    <span class="sidebar-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 19a-2 2 0 0 0-2-2H4a-2 2 0 0 0-2 2v5a-2 2 0 0 0 2 2h16a-2 2 0 0 0 2-2v-5z"></path>
                            <path d="M22 3H2a-2 2 0 0 0-2 2v5a-2 2 0 0 0 2 2h16a-2 2 0 0 0 2-2V5a-2 2 0 0 0-2-2z"></path>
                            <line x1="2" y1="8" x2="22" y2="8"></line>
                        </svg>
                    </span>
                    All Projects
                </li>

                <li class="sidebar-menu-item" onclick="navigateTo('project-details')">
                    <span class="sidebar-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-6l-2-2H5a2 2 0 0 0-2 2z"></path>
                        </svg>
                    </span>
                    Website Redesign
                </li>

                <li class="sidebar-menu-item" onclick="navigateTo('project-settings')">
                    <span class="sidebar-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                    </span>
                    Project Settings
                </li>
            </ul>

            <div class="sidebar-footer">
                <div class="user-avatar-circle" title="John Smith">JS</div>
            </div>
        </aside>

        <!-- Board -->
        <div class="board-container">
            <div class="board-header">
                <div class="board-title">
                    <h1 id="boardName">Kanban Board</h1>
                    <p class="board-subtitle" id="boardSubtitle"></p>
                </div>


            </div>

            <div class="board-columns" id="boardColumns"></div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="issueModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Issue Details</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="issueForm">
                    <div class="form-group">
                        <label class="form-label" for="issueKey">Issue Key</label>
                        <input type="text" id="issueKey" class="form-input" readonly>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="issueTitle">Summary</label>
                        <input type="text" id="issueTitle" class="form-input">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="issueType">Issue Type</label>
                        <select id="issueType" class="form-input">
                            <option value="Story">Story</option>
                            <option value="Task">Task</option>
                            <option value="Bug">Bug</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="issuePriority">Priority</label>
                        <select id="issuePriority" class="form-input">
                            <option value="High">High</option>
                            <option value="Medium">Medium</option>
                            <option value="Low">Low</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="issueAssignee">Assignee</label>
                        <input type="text" id="issueAssignee" class="form-input" placeholder="Assign to...">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="issueLabels">Labels (comma separated)</label>
                        <input type="text" id="issueLabels" class="form-input" placeholder="e.g., Frontend, Bug">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="issueDescription">Description</label>
                        <textarea id="issueDescription" class="form-input" rows="5"></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="issueStatus">Status</label>
                        <select id="issueStatus" class="form-input">
                            <option value="To Do">To Do</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Code Review">Code Review</option>
                            <option value="QA">QA</option>
                            <option value="Done">Done</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveIssue()">Save Issue</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'api/board.json';

        let currentIssue = null;
        const issues = {};

        const priorityColors = {
            high: '#ff6b6b',
            medium: '#ffb74d',
            low: '#90a4ae'
        };

        const prioritySvg = (color) => `
            <svg width="14" height="14" viewBox="0 0 24 24" fill="${color}">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                <line x1="12" y1="9" x2="12" y2="13"></line>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>`;

        function renderTaskCard(task) {
            const labelsHtml = task.labels.map(l => `<span class="label">${l}</span>`).join('');
            const color = priorityColors[task.priority] || priorityColors.medium;

            let bottomHtml = '';
            if (task.status && task.statusText) {
                bottomHtml = `<div class="status status-${task.status}">${task.statusText}</div>`;
            } else {
                bottomHtml = `
                    <div class="task-meta">
                        <div class="meta-item priority-${task.priority}">
                            ${prioritySvg(color)}
                        </div>
                    </div>`;
            }

            return `
                <div class="task-card" draggable="true" onclick="openModal('${task.key}')" ondragstart="dragStart(event)">
                    <div class="labels">${labelsHtml}</div>
                    <div class="task-header">
                        <span class="task-key">${task.key}</span>
                        <span class="task-type">${task.type}</span>
                    </div>
                    <div class="task-title">${task.title}</div>
                    ${bottomHtml}
                </div>`;
        }

        function renderColumn(column) {
            const tasksHtml = column.tasks.map(renderTaskCard).join('');
            return `
                <div class="column">
                    <div class="column-header">
                        <span>${column.title}</span>
                        <span class="column-count">${column.tasks.length}</span>
                    </div>
                    <div class="column-tasks">${tasksHtml}</div>
                </div>`;
        }

        function initDragAndDrop() {
            let draggedItem = null;

            window.dragStart = function(event) {
                draggedItem = event.target.closest('.task-card');
                draggedItem.classList.add('dragging');
                event.dataTransfer.effectAllowed = 'move';
                event.dataTransfer.setData('text/plain', '');
                setTimeout(() => { draggedItem.style.opacity = '0.5'; }, 0);
            };

            document.querySelectorAll('.column-tasks').forEach(container => {
                container.addEventListener('dragover', function(e) {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    const afterElement = getDragAfterElement(container, e.clientY);
                    const draggable = document.querySelector('.dragging');
                    if (!draggable) return;
                    if (afterElement == null) {
                        container.appendChild(draggable);
                    } else {
                        container.insertBefore(draggable, afterElement);
                    }
                });

                container.addEventListener('dragenter', function(e) {
                    e.preventDefault();
                    if (e.target.classList.contains('column-tasks')) {
                        container.style.backgroundColor = '#e0e5eb';
                    }
                });

                container.addEventListener('dragleave', function(e) {
                    if (!container.contains(e.relatedTarget)) {
                        container.style.backgroundColor = '';
                    }
                });

                container.addEventListener('drop', function(e) {
                    e.preventDefault();
                    container.style.backgroundColor = '';
                    if (!draggedItem) return;

                    const afterElement = getDragAfterElement(container, e.clientY);
                    if (afterElement == null) {
                        container.appendChild(draggedItem);
                    } else {
                        container.insertBefore(draggedItem, afterElement);
                    }

                    draggedItem.classList.remove('dragging');
                    draggedItem.style.opacity = '';
                    draggedItem = null;
                });
            });

            function getDragAfterElement(container, y) {
                const draggableElements = [...container.querySelectorAll('.task-card:not(.dragging)')];
                return draggableElements.reduce((closest, child) => {
                    const box = child.getBoundingClientRect();
                    const offset = y - box.top - box.height / 2;
                    if (offset < 0 && offset > closest.offset) {
                        return { offset: offset, element: child };
                    } else {
                        return closest;
                    }
                }, { offset: Number.NEGATIVE_INFINITY }).element;
            }

            document.addEventListener('dragend', function(e) {
                if (e.target.classList.contains('task-card')) {
                    e.target.classList.remove('dragging');
                    e.target.style.opacity = '';
                }
            });
        }

        async function loadBoard() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                document.getElementById('boardName').textContent = data.board.name;
                document.getElementById('boardSubtitle').textContent =
                    `Project: ${data.board.project} \u2022 ${data.board.sprint}`;

                const columnsContainer = document.getElementById('boardColumns');
                columnsContainer.innerHTML = data.columns.map(renderColumn).join('');

                data.columns.forEach(column => {
                    column.tasks.forEach(task => {
                        issues[task.key] = {
                            key: task.key,
                            title: task.title,
                            type: task.type,
                            priority: task.priority.charAt(0).toUpperCase() + task.priority.slice(1),
                            assignee: task.assignee,
                            labels: task.labels,
                            description: task.description,
                            status: task.statusText || 'To Do'
                        };
                    });
                });

                initDragAndDrop();
            } catch (error) {
                console.error('Failed to load board data:', error);
            }
        }

        function openModal(issueKey) {
            const modal = document.getElementById('issueModal');
            currentIssue = issues[issueKey];
            if (!currentIssue) return;

            document.getElementById('issueKey').value = currentIssue.key;
            document.getElementById('issueTitle').value = currentIssue.title;
            document.getElementById('issueType').value = currentIssue.type;
            document.getElementById('issuePriority').value = currentIssue.priority;
            document.getElementById('issueAssignee').value = currentIssue.assignee;
            document.getElementById('issueLabels').value = currentIssue.labels.join(', ');
            document.getElementById('issueDescription').value = currentIssue.description;
            document.getElementById('issueStatus').value = currentIssue.status;

            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('issueModal').style.display = 'none';
            currentIssue = null;
        }

        function saveIssue() {
            if (currentIssue) {
                currentIssue.title = document.getElementById('issueTitle').value;
                currentIssue.type = document.getElementById('issueType').value;
                currentIssue.priority = document.getElementById('issuePriority').value;
                currentIssue.assignee = document.getElementById('issueAssignee').value;
                currentIssue.labels = document.getElementById('issueLabels').value.split(',').map(l => l.trim()).filter(l => l);
                currentIssue.description = document.getElementById('issueDescription').value;
                currentIssue.status = document.getElementById('issueStatus').value;
                console.log('Updated issue:', currentIssue);
                closeModal();
            }
        }

        document.getElementById('issueModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.querySelector('.search-bar input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') console.log('Search:', this.value);
        });

        loadBoard();
    </script>
</body>
</html>
