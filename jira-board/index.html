<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jira - Board - Teams in Space</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- Icon Sidebar -->
<aside class="icon-sidebar">
  <div class="icon-sidebar-top">
    <a href="#" class="icon-item logo-item">
      <i class="fa-solid fa-diamond"></i>
    </a>
    <a href="#" class="icon-item"><i class="fa-solid fa-magnifying-glass"></i></a>
    <a href="#" class="icon-item"><i class="fa-solid fa-plus"></i></a>
  </div>
  <div class="icon-sidebar-bottom">
    <a href="#" class="icon-item"><i class="fa-regular fa-circle-question"></i></a>
    <a href="#" class="icon-item avatar-icon">
      <div class="sidebar-avatar-sm"></div>
    </a>
  </div>
</aside>

<!-- Navigation Sidebar -->
<aside class="nav-sidebar">
  <div class="project-header">
    <div class="project-icon">
      <i class="fa-solid fa-rocket"></i>
    </div>
    <div class="project-info">
      <span class="project-name">Teams in Space</span>
      <span class="project-type">Software project</span>
    </div>
  </div>

  <nav class="nav-menu">
    <a href="#" class="nav-item">
      <i class="fa-solid fa-layer-group"></i>
      <span>Backlog</span>
    </a>
    <a href="#" class="nav-item active">
      <i class="fa-solid fa-table-columns"></i>
      <span>Board</span>
    </a>
    <a href="#" class="nav-item">
      <i class="fa-solid fa-chart-line"></i>
      <span>Reports</span>
    </a>
    <a href="#" class="nav-item">
      <i class="fa-solid fa-ship"></i>
      <span>Releases</span>
    </a>
    <a href="#" class="nav-item">
      <i class="fa-solid fa-puzzle-piece"></i>
      <span>Components</span>
    </a>
    <a href="#" class="nav-item">
      <i class="fa-solid fa-list-check"></i>
      <span>Issues</span>
    </a>
    <a href="#" class="nav-item">
      <i class="fa-solid fa-code-branch"></i>
      <span>Repository</span>
    </a>
    <a href="#" class="nav-item">
      <i class="fa-solid fa-plus"></i>
      <span>Add item</span>
    </a>
    <a href="#" class="nav-item">
      <i class="fa-solid fa-gear"></i>
      <span>Settings</span>
    </a>
  </nav>
</aside>

<!-- Main Content -->
<main class="main-content">
  <div class="board-header">
    <h1 class="board-title">Board</h1>
    <div class="board-header-actions">
      <button class="release-btn">Release</button>
      <button class="more-btn"><i class="fa-solid fa-ellipsis"></i></button>
    </div>
  </div>

  <div class="filter-bar">
    <button class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
    <span class="quick-filters">Quick Filters <i class="fa-solid fa-chevron-down"></i></span>
  </div>

  <div class="board-columns">
    <!-- TO DO Column -->
    <div class="column" data-status="todo">
      <div class="column-header">
        <span class="column-title">TO DO</span>
        <span class="column-count">0</span>
      </div>
      <div class="column-cards"></div>
    </div>

    <!-- IN PROGRESS Column -->
    <div class="column" data-status="in_progress">
      <div class="column-header">
        <span class="column-title">IN PROGRESS</span>
        <span class="column-count">0</span>
      </div>
      <div class="column-cards"></div>
    </div>

    <!-- CODE REVIEW Column -->
    <div class="column" data-status="code_review">
      <div class="column-header">
        <span class="column-title">CODE REVIEW</span>
        <span class="column-count">0</span>
      </div>
      <div class="column-cards"></div>
    </div>

    <!-- DONE Column -->
    <div class="column" data-status="done">
      <div class="column-header">
        <span class="column-title">DONE</span>
        <span class="column-count">0</span>
      </div>
      <div class="column-cards"></div>
    </div>
  </div>
</main>

<script src="drag-drop.js"></script>
</body>
</html>
